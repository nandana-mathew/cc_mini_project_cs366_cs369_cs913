<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distributed Drawing Board</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #container { display: flex; flex: 1; overflow: hidden; }
    #canvas-section { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    #status-bar {
      height: 36px; background: #16213e; display: flex; align-items: center;
      padding: 0 16px; gap: 24px; font-family: monospace; font-size: 13px;
      color: #a8b2d8; border-bottom: 1px solid #0f3460; flex-shrink: 0;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-connected { background: #4ade80; }
    .dot-disconnected { background: #f87171; animation: blink 1s infinite; }
    .dot-reconnecting { background: #fbbf24; animation: blink 0.5s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #canvas { flex: 1; cursor: crosshair; touch-action: none; width: 100%; height: 100%; display: block; }
    #brush-controls {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 100;
      background: rgba(22,33,62,0.9); border: 1px solid #0f3460; border-radius: 12px;
      padding: 8px 16px; display: flex; gap: 12px; align-items: center;
    }
    .color-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: white; transform: scale(1.2); }
    .eraser-btn { display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-family: sans-serif; font-size: 11px; }
    input[type=range] { accent-color: #7c83fd; }
    
    /* Dashboard Styles */
    #dashboard {
      width: 320px; background: #0f1419; border-left: 1px solid #0f3460; display: flex; flex-direction: column;
      overflow: hidden; font-family: monospace; color: #a8b2d8; font-size: 11px;
    }
    #dashboard-header {
      padding: 12px; background: #16213e; border-bottom: 1px solid #0f3460;
      font-weight: bold; text-align: center; color: #4ade80;
    }
    #dashboard-tabs {
      display: flex; gap: 0; border-bottom: 1px solid #0f3460;
    }
    .dashboard-tab {
      flex: 1; padding: 8px; background: #16213e; border: none; color: #a8b2d8;
      cursor: pointer; font-family: monospace; font-size: 11px; transition: 0.2s;
      border-bottom: 2px solid transparent;
    }
    .dashboard-tab.active {
      background: #1a2d4d; color: #4ade80; border-bottom-color: #4ade80;
    }
    .dashboard-tab:hover { background: #1a2d4d; }
    
    #dashboard-content {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    }
    
    .dashboard-panel { display: none; flex: 1; overflow-y: auto; padding: 12px; }
    .dashboard-panel.active { display: flex; flex-direction: column; }
    
    .status-item {
      margin-bottom: 12px; padding: 8px; background: #16213e; border-radius: 4px;
      border-left: 2px solid #0f3460;
    }
    .status-label { color: #7c83fd; font-weight: bold; margin-bottom: 2px; }
    .status-value { color: #4ade80; word-break: break-all; }
    
    .log-entry {
      margin-bottom: 8px; padding: 8px; background: #16213e; border-radius: 3px;
      border-left: 2px solid #0f3460; font-size: 10px; line-height: 1.3;
    }
    .log-time { color: #7c83fd; margin-right: 6px; }
    .log-event { color: #a8b2d8; }
    .log-event.election { color: #fbbf24; }
    .log-event.failure { color: #f87171; }
    .log-event.success { color: #4ade80; }
    
    #clear-logs-btn {
      margin-top: auto; background: #16213e; border: 1px solid #0f3460; color: #a8b2d8;
      padding: 6px; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 10px;
      transition: 0.2s;
    }
    #clear-logs-btn:hover { background: #1a2d4d; color: #4ade80; }
    
    /* Undo Redo Buttons */
    .undo-redo-controls {
      position: fixed; bottom: 16px; left: 16px; z-index: 100;
      display: flex; gap: 6px;
    }
    .undo-btn, .redo-btn {
      background: rgba(22,33,62,0.9); border: 1px solid #0f3460; color: #a8b2d8;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 12px;
      transition: 0.2s; font-weight: bold;
    }
    .undo-btn:hover:not(:disabled), .redo-btn:hover:not(:disabled) {
      background: #167aff; color: white; border-color: #167aff;
    }
    .undo-btn:disabled, .redo-btn:disabled {
      opacity: 0.3; cursor: not-allowed;
    }
    
    /* Scrollbar styling */
    #dashboard-content::-webkit-scrollbar {
      width: 6px;
    }
    #dashboard-content::-webkit-scrollbar-track {
      background: #0f1419;
    }
    #dashboard-content::-webkit-scrollbar-thumb {
      background: #0f3460;
      border-radius: 3px;
    }
    #dashboard-content::-webkit-scrollbar-thumb:hover {
      background: #16537e;
    }
  </style>
</head>
<body>
  <div id="status-bar">
    <span><span class="status-dot dot-disconnected" id="conn-dot"></span><span id="conn-status">Connecting...</span></span>
    <span>Leader: <strong id="leader-display">unknown</strong></span>
    <span>Term: <strong id="term-display">—</strong></span>
    <span>Log: <strong id="log-display">0</strong> strokes</span>
    <button id="kill-leader-btn" style="margin-left:auto; background:#f87171; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold; transition: 0.2s;">Simulate Leader Failure</button>
  </div>
  
  <div id="container">
    <div id="canvas-section">
      <canvas id="canvas"></canvas>
      <div class="undo-redo-controls">
        <button class="undo-btn" id="undo-btn" disabled>↶ Undo</button>
        <button class="redo-btn" id="redo-btn" disabled>↷ Redo</button>
      </div>
      <div id="brush-controls">
        <span style="color:#a8b2d8;font-size:13px;font-family:monospace">Size:</span>
        <input type="range" id="brush-size" min="2" max="20" value="4" style="width:80px">
        <div class="color-btn active" style="background:#7c83fd" data-color="#7c83fd"></div>
        <div class="color-btn" style="background:#f472b6" data-color="#f472b6"></div>
        <div class="color-btn" style="background:#4ade80" data-color="#4ade80"></div>
        <div class="color-btn" style="background:#fbbf24" data-color="#fbbf24"></div>
        <div class="color-btn" style="background:#f87171" data-color="#f87171"></div>
        <div class="color-btn" style="background:#e2e8f0" data-color="#e2e8f0"></div>
        <div class="color-btn eraser-btn" style="background:#444" data-color="eraser" title="Eraser">E</div>
      </div>
    </div>
    
    <!-- Enhanced Dashboard -->
    <div id="dashboard">
      <div id="dashboard-header">📊 System Dashboard</div>
      <div id="dashboard-tabs">
        <button class="dashboard-tab active" data-tab="status">Status</button>
        <button class="dashboard-tab" data-tab="events">Events</button>
        <button class="dashboard-tab" data-tab="replicas">Replicas</button>
      </div>
      <div id="dashboard-content">
        <!-- Status Tab -->
        <div id="status-tab" class="dashboard-panel active">
          <div class="status-item">
            <div class="status-label">🔗 Connection</div>
            <div class="status-value" id="status-conn">Connecting...</div>
          </div>
          <div class="status-item">
            <div class="status-label">👑 Leader</div>
            <div class="status-value" id="status-leader">Unknown</div>
          </div>
          <div class="status-item">
            <div class="status-label">📈 Current Term</div>
            <div class="status-value" id="status-term">0</div>
          </div>
          <div class="status-item">
            <div class="status-label">📝 Log Entries</div>
            <div class="status-value" id="status-log">0</div>
          </div>
          <div class="status-item">
            <div class="status-label">🎨 Strokes Local</div>
            <div class="status-value" id="status-strokes">0</div>
          </div>
        </div>
        
        <!-- Events Tab -->
        <div id="events-tab" class="dashboard-panel">
          <div id="events-log"></div>
          <button id="clear-logs-btn">Clear Logs</button>
        </div>
        
        <!-- Replicas Tab -->
        <div id="replicas-tab" class="dashboard-panel">
          <div id="replicas-info"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="canvas.js"></script>
</body>
</html>
