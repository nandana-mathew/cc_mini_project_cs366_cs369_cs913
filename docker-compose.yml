networks:
  raft-net:
    driver: bridge

services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    networks:
      - raft-net
    environment:
      - REPLICA_URLS=http://replica1:3001,http://replica2:3002,http://replica3:3003
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
      replica3:
        condition: service_healthy

  replica1:
    build: ./replica1
    ports:
      - "3001:3001"
    networks:
      - raft-net
    environment:
      - REPLICA_ID=replica1
      - REPLICA_PORT=3001
      - PEER_URLS=http://replica2:3002,http://replica3:3003
      - GATEWAY_NOTIFY_URL=http://gateway:8080/leader-update
    volumes:
      - ./replica1:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  replica2:
    build: ./replica2
    ports:
      - "3002:3002"
    networks:
      - raft-net
    environment:
      - REPLICA_ID=replica2
      - REPLICA_PORT=3002
      - PEER_URLS=http://replica1:3001,http://replica3:3003
      - GATEWAY_NOTIFY_URL=http://gateway:8080/leader-update
    volumes:
      - ./replica2:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  replica3:
    build: ./replica3
    ports:
      - "3003:3003"
    networks:
      - raft-net
    environment:
      - REPLICA_ID=replica3
      - REPLICA_PORT=3003
      - PEER_URLS=http://replica1:3001,http://replica2:3002
      - GATEWAY_NOTIFY_URL=http://gateway:8080/leader-update
    volumes:
      - ./replica3:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
