services:
  gateway:
    build: ./gateway
    network_mode: host
    environment:
      - REPLICA_URLS=http://localhost:3001,http://localhost:3002,http://localhost:3003
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
      replica3:
        condition: service_healthy

  replica1:
    build: ./replica1
    network_mode: host
    environment:
      - REPLICA_ID=replica1
      - REPLICA_PORT=3001
      - PEER_URLS=http://localhost:3002,http://localhost:3003
      - GATEWAY_NOTIFY_URL=http://localhost:8080/leader-update
    volumes:
      - ./replica1:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  replica2:
    build: ./replica2
    network_mode: host
    environment:
      - REPLICA_ID=replica2
      - REPLICA_PORT=3002
      - PEER_URLS=http://localhost:3001,http://localhost:3003
      - GATEWAY_NOTIFY_URL=http://localhost:8080/leader-update
    volumes:
      - ./replica2:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  replica3:
    build: ./replica3
    network_mode: host
    environment:
      - REPLICA_ID=replica3
      - REPLICA_PORT=3003
      - PEER_URLS=http://localhost:3001,http://localhost:3002
      - GATEWAY_NOTIFY_URL=http://localhost:8080/leader-update
    volumes:
      - ./replica3:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
